name: Release Builds (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number (optional override)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Run Tests & Static Analysis
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Resolve shared build number
        id: version
        env:
          OVERRIDE: ${{ inputs.build_number }}
        run: |
          NUMBER="${OVERRIDE:-$GITHUB_RUN_NUMBER}"
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "build_number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Commit: $GITHUB_SHA / build: $NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Analyze Code
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  build-android:
    name: Build Android App Bundle (.aab)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Required Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_PROPERTIES" || {
            echo 'Release signing secrets are required.'; exit 1;
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/aura-quest-release.jks
          printf '%s' "$KEY_PROPERTIES" > android/key.properties

      - name: Build App Bundle (.aab)
        env:
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          BUILD_ARGS=(--release)
          if [ -n "$BUILD_NUMBER" ]; then
            [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || exit 1
            BUILD_ARGS+=("--build-number=$BUILD_NUMBER")
          fi
          flutter build appbundle "${BUILD_ARGS[@]}"

      - name: Verify release certificate and record provenance
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab > certificate.txt
          ! grep -q 'Android Debug' certificate.txt
          printf 'commit=%s\nbuild=%s\n' "$GITHUB_SHA" '${{ needs.validate.outputs.build_number }}' > build/app/outputs/bundle/release/build-info.txt

      - name: Upload Android Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle-${{ needs.validate.outputs.build_number }}
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/bundle/release/build-info.txt
          if-no-files-found: error

  build-ios:
    name: Build iOS archive (unsigned, not for submission)
    needs: validate
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Apple SDK requirement
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK%%.*}" -ge 26

      - name: Build iOS Archive
        env:
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          BUILD_ARGS=(--release --no-codesign)
          if [ -n "$BUILD_NUMBER" ]; then
            [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || exit 1
            BUILD_ARGS+=("--build-number=$BUILD_NUMBER")
          fi
          flutter build ipa "${BUILD_ARGS[@]}"

      - name: Record archive provenance
        run: |
          printf 'commit=%s\nbuild=%s\nsigning=unsigned\n' "$GITHUB_SHA" '${{ needs.validate.outputs.build_number }}' > build/ios/archive/build-info.txt

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-archive-${{ needs.validate.outputs.build_number }}
          path: build/ios/archive/
          if-no-files-found: error
