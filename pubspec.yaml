# ─────────────────────────────────────────────────────────────
# AURA QUEST — Gamified social habit tracker
# MVP Phase 1: Project skeleton
# ─────────────────────────────────────────────────────────────
name: aura_quest
description: "Gamified social habit-tracker where friends compete in challenges using Aura points."
publish_to: "none" # This is an app, not a package — never publish to pub.dev.
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ── Backend ──────────────────────────────────────────────
  supabase_flutter: ^2.9.0 # Auth + Postgres database + Realtime

  # ── State management ─────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Navigation ───────────────────────────────────────────
  go_router: ^16.0.0

  # ── UI / Design ──────────────────────────────────────────
  google_fonts: ^6.2.1 # 'Press Start 2P' (pixel) + 'Space Grotesk' (body)
  cupertino_icons: ^1.0.8

  # ── Local storage & Networking ───────────────────────────
  # Tracks which defeats the player has already been roasted for and pending check-ins.
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.1.0

  # ── Text handling ────────────────────────────────────────
  # Grapheme clusters: an emoji like 🇩🇪 or 👨‍👩‍👧 is several codepoints
  # but ONE character to a human. Ships with Flutter, declared here
  # because we import it directly (avatar emoji parsing).
  characters: ^1.4.0
  intl: ^0.20.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0
  unifiedpush: ^6.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Erzeugt die Starter-Symbole aus assets/icon.
# Neu erzeugen nach einer Aenderung:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  # Adaptive Icons trennen Vorder- und Hintergrund. Android beschneidet
  # die Vordergrundebene je nach Geraeteform - deshalb liegt der Blitz
  # dort kleiner und mittig, sonst fehlten die Spitzen.
  adaptive_icon_background: "#0D0F10"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  # iOS erlaubt keine Transparenz im App-Symbol.
  remove_alpha_ios: true
