<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f2f2f0;">
<!--
  Mail zum Zuruecksetzen des Passworts.
  Aufbau bewusst identisch zur Bestaetigungsmail: Wer beide Mails kennt,
  soll sie nicht verwechseln muessen. Gleiche Bauweise, gleicher Ton,
  nur ein anderer Anlass.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#f2f2f0;padding:32px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="max-width:480px;background:#ffffff;border-radius:14px;
                  border:1px solid #e2e4e6;">

      <tr><td style="padding:32px 32px 8px;text-align:center;">
        <div style="font-size:34px;line-height:1;">&#9889;</div>
        <div style="font:700 22px/1.3 -apple-system,'Segoe UI',Roboto,sans-serif;
                    color:#17191a;letter-spacing:-0.3px;padding-top:10px;">
          AURA QUEST
        </div>
      </td></tr>

      <tr><td style="padding:14px 32px 0;text-align:center;
                     font:400 16px/1.55 -apple-system,'Segoe UI',Roboto,sans-serif;
                     color:#5c6266;">
        Someone asked to reset the password for this address.
        Enter this code in the app:
      </td></tr>

      <tr><td align="center" style="padding:22px 32px 6px;">
        <div style="display:inline-block;background:#fff8e1;
                    border:2px solid #ffc700;border-radius:12px;
                    padding:14px 26px;
                    font:700 34px/1 -apple-system,'Segoe UI',Roboto,sans-serif;
                    color:#17191a;letter-spacing:9px;">
          {{ .Token }}
        </div>
      </td></tr>

      <tr><td style="padding:16px 32px 0;text-align:center;
                     font:400 14px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;
                     color:#8a9096;">
        The app then asks you for a new password.
      </td></tr>

      <tr><td style="padding:26px 32px 32px;text-align:center;
                     border-top:1px solid #eceef0;
                     font:400 12px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;
                     color:#a0a6ab;">
        <!-- Wichtig fuer den Fall, dass jemand FREMDES das ausgeloest hat:
             Die Mail muss klarstellen, dass nichts passiert ist, solange
             der Code nicht benutzt wird. Sonst geraet der Empfaenger in
             Panik und aendert Passwoerter, die niemand angegriffen hat. -->
        Was that not you? Then ignore this mail. Your password stays as
        it is until this code is used.
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
